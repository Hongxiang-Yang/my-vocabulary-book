<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f5f7">
    <title>Hongxiang Vocabulary</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body class="initial-loading">
    <div id="loadingOverlay" class="loading-overlay" aria-live="polite" aria-label="Loading vocabulary">
      <div class="loading-card">
        <img src="./favicon.svg" alt="" aria-hidden="true">
        <strong>Loading</strong>
      </div>
    </div>
    <main id="appShell" class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <img class="brand-mark" src="./favicon.svg" alt="" aria-hidden="true">
          <div class="brand-copy">
            <h1>Hongxiang Vocabulary</h1>
          </div>
          <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-label="Toggle sidebar" aria-expanded="true">
            <span id="sidebarToggleIcon" aria-hidden="true">‹|</span>
          </button>
        </div>

        <nav class="filters" aria-label="Vocabulary views">
          <button class="filter active" type="button" data-filter="review">
            <span class="nav-icon" aria-hidden="true">✓</span>
            <span class="nav-label">Check mastery</span>
          </button>
          <button class="filter" type="button" data-filter="mastered">
            <span class="nav-icon" aria-hidden="true">M</span>
            <span class="nav-label">Mastered</span>
          </button>
          <button class="filter" type="button" data-filter="add">
            <span class="nav-icon" aria-hidden="true">+</span>
            <span class="nav-label">Add word</span>
          </button>
          <button class="filter secondary" type="button" data-filter="all">
            <span class="nav-icon" aria-hidden="true">A</span>
            <span class="nav-label">All words</span>
          </button>
        </nav>

        <section class="theme-panel" aria-label="Theme">
          <label for="themeSelect">Theme</label>
          <select id="themeSelect">
            <option value="mist">Mist</option>
            <option value="graphite">Graphite</option>
            <option value="paper">Paper</option>
          </select>
        </section>

        <section class="sidebar-panel">
          <div class="metric">
            <span>Total</span>
            <strong id="totalCount">0</strong>
          </div>
          <div class="metric">
            <span>Learning</span>
            <strong id="learningCount">0</strong>
          </div>
          <div class="metric">
            <span>Mastered</span>
            <strong id="masteredCount">0</strong>
          </div>
        </section>
      </aside>

      <section class="workspace">
        <header class="toolbar">
          <div>
            <p class="eyebrow">Personal word bank</p>
            <h2 id="pageTitle">Check mastery</h2>
          </div>
          <div class="toolbar-actions">
            <input id="search" type="search" placeholder="Search word, meaning, or service">
            <button id="refresh" class="icon-button" type="button" aria-label="Refresh">Refresh</button>
          </div>
        </header>

        <section id="reviewDeck" class="review-deck" aria-label="Mastery check">
          <div class="review-copy">
            <span id="summary">Loading saved words...</span>
            <strong id="todayWord">Ready when you are.</strong>
            <p id="reviewMeaning" class="review-meaning"></p>
          </div>
          <div class="review-actions">
            <button id="reveal" type="button">Reveal</button>
            <button id="markMastered" type="button">Mastered</button>
          </div>
        </section>

        <section id="addWordPanel" class="manual-panel" aria-label="Add word">
          <form id="addWordForm" class="manual-form">
            <div class="manual-field manual-word-field">
              <label for="manualWord">Word</label>
              <div class="manual-input-row">
                <input id="manualWord" type="text" autocomplete="off" spellcheck="false" placeholder="example">
                <button id="lookupWord" class="icon-button" type="button">Lookup</button>
              </div>
            </div>

            <div class="manual-field">
              <label for="manualMeaning">Meaning</label>
              <textarea id="manualMeaning" rows="9" placeholder="Meaning will appear here"></textarea>
            </div>

            <div id="lookupStatus" class="lookup-status" aria-live="polite"></div>

            <div class="manual-actions">
              <button id="saveWord" type="submit" disabled>Save to wordbook</button>
              <button id="clearManualWord" type="button">Clear</button>
            </div>
          </form>
        </section>

        <section class="content-grid">
          <div id="wordList" class="word-list" aria-live="polite"></div>
          <aside id="detailPanel" class="detail-panel">
            <div class="empty-detail">
              <span>Choose a word</span>
              <p>Its meaning, source, and review notes will appear here.</p>
            </div>
          </aside>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
